<!doctype html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BOOK_TITLE}} — CRISP 閱讀報告</title>
<style>
  :root,
  [data-theme="light"] {
    color-scheme: light;
    --bg: #e4ddd2;
    --surface: #fbf8f1;
    --surface-alt: #f2ece1;
    --ink: #241b16;
    --body: #4b4036;
    --muted: #6c5f54;
    --rule: #d2c5b5;
    --accent: #87482f;
    --accent-strong: #65311f;
    --accent-soft: #f0dfd3;
    --focus: #9a4b2d;
    --selection: #dfbda7;
    --serif: Baskerville, "Noto Serif TC", Georgia, "Times New Roman", serif;
    --sans: "Noto Sans TC", "PingFang TC", system-ui, -apple-system, sans-serif;
    --measure: 660px;
    --shell: 860px;
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #12100e;
    --surface: #1d1916;
    --surface-alt: #28211c;
    --ink: #f5ede3;
    --body: #d9cabe;
    --muted: #b8a596;
    --rule: #514339;
    --accent: #e1a17c;
    --accent-strong: #f0bea1;
    --accent-soft: #35241d;
    --focus: #f0ac83;
    --selection: #70452f;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html {
    font-size: 17px;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: var(--accent) var(--bg);
  }
  body {
    margin: 0;
    min-width: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--body);
    font-family: var(--serif);
    line-height: 1.78;
    font-kerning: normal;
    font-variant-numeric: oldstyle-nums proportional-nums;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: var(--bg); }
  *::-webkit-scrollbar-thumb { border: 3px solid var(--bg); background: var(--accent); }
  ::selection { background: var(--selection); color: var(--ink); }
  a { color: var(--accent-strong); text-underline-offset: 0.2em; text-decoration-thickness: 0.07em; }
  a:hover { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  h1, h2, h3 { color: var(--ink); line-height: 1.28; text-wrap: balance; }
  h1 { font-size: clamp(2.5rem, 6.4vw, 4.35rem); font-weight: 500; letter-spacing: -0.035em; }
  h2 {
    display: grid;
    grid-template-columns: auto minmax(2rem, 1fr);
    align-items: center;
    gap: 1rem;
    margin: 0 0 1.5rem;
    font-size: clamp(1.5rem, 4vw, 1.9rem);
    font-weight: 600;
    letter-spacing: -0.018em;
  }
  h2::after { content: ""; border-top: 1px solid var(--rule); }
  h3 { margin: 0 0 0.65rem; font-size: 1.08rem; font-weight: 600; }
  p { margin: 0 0 1rem; }
  p:last-child { margin-bottom: 0; }
  ul, ol { padding-left: 1.35rem; }
  li + li { margin-top: 0.45rem; }
  .page { width: min(100%, var(--measure)); margin-inline: auto; padding-inline: 1.5rem; }
  .report-shell {
    width: min(calc(100% - 3rem), var(--shell));
    margin: 1.5rem auto 3rem;
    border: 1px solid var(--rule);
    background: var(--surface);
  }
  .breakable { overflow-wrap: anywhere; word-break: break-word; }
  .skip-link {
    position: fixed;
    z-index: 20;
    top: 0.75rem;
    left: 0.75rem;
    transform: translateY(-180%);
    padding: 0.65rem 0.9rem;
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink);
    font-family: var(--sans);
  }
  .skip-link:focus { transform: translateY(0); }

  .header {
    position: relative;
    padding-block: clamp(3.75rem, 8vw, 5.5rem) clamp(3rem, 7vw, 4rem);
    border-bottom: 1px solid var(--rule);
  }
  .header::before {
    content: "";
    position: absolute;
    top: 1.6rem;
    left: 50%;
    width: 3.5rem;
    border-top: 1px solid var(--accent);
    transform: translateX(-50%);
  }
  .header .page { animation: opening-page 680ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  .header__meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.45rem 0.8rem;
    margin: 1.5rem auto 0;
    color: var(--accent);
    font-family: var(--sans);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.065em;
  }
  .header__meta span + span::before { content: "·"; margin-right: 0.8rem; color: var(--muted); }
  .header h1 { max-width: 10em; margin: 0 auto; text-align: center; overflow-wrap: anywhere; }
  .header__author { margin: 1rem 0 0; text-align: center; color: var(--muted); }
  .header__review {
    max-width: 36rem;
    margin: 2rem auto 0;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    color: var(--ink);
    font-size: 1.13rem;
    line-height: 1.85;
    text-align: left;
  }

  .coverage { padding-block: clamp(2.75rem, 6vw, 3.75rem); border-bottom: 1px solid var(--rule); }
  .book-intro { max-width: 62ch; font-size: 1.03rem; line-height: 1.9; }
  .scope-list { margin: 1.9rem 0 0; border-bottom: 1px solid var(--rule); }
  .scope-row { display: grid; grid-template-columns: minmax(6rem, 0.27fr) 1fr; gap: 0.75rem 1.25rem; padding: 0.8rem 1rem; border-top: 1px solid var(--rule); }
  .scope-row:nth-child(odd) { background: var(--surface-alt); }
  .scope-row dt { color: var(--accent-strong); font-family: var(--sans); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.045em; }
  .scope-row dd { margin: 0; color: var(--ink); }
  .scope-limit { margin-top: 1.8rem; padding: 1.15rem 1.35rem; border-left: 1px solid var(--accent); background: var(--accent-soft); }
  .scope-limit h3 { color: var(--accent-strong); font-family: var(--sans); font-size: 0.95rem; }
  .scope-limit ul { margin: 0; }

  .toolbar-wrap { border-bottom: 1px solid var(--rule); background: var(--surface-alt); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; padding-block: 0.8rem; }
  .toolbar button {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 0.8rem;
    border: 1px solid var(--rule);
    border-radius: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
  .toolbar button:active { border-color: var(--accent-strong); background: var(--surface); }
  .toolbar svg { width: 17px; height: 17px; flex: 0 0 auto; }
  [data-theme="light"] .icon-sun, [data-theme="dark"] .icon-moon { display: none; }
  .status { flex: 1 1 12rem; margin: 0; color: var(--muted); font-family: var(--sans); font-size: 0.82rem; }
  .status[data-state="error"] { color: #9b3027; }
  [data-theme="dark"] .status[data-state="error"] { color: #ffaca4; }
  .noscript-note { padding-block: 0.8rem; color: var(--muted); font-family: var(--sans); font-size: 0.84rem; }

  .copy-recovery { margin-top: 0.75rem; width: 100%; }
  .copy-recovery p { margin-bottom: 0.45rem; }
  .copy-recovery textarea {
    width: 100%;
    min-height: 11rem;
    resize: vertical;
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink);
    padding: 0.75rem;
    font: 0.8rem/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .toc { padding-block: 2.5rem; border-bottom: 1px solid var(--rule); }
  .toc h2 { font-size: 1.05rem; margin-bottom: 1.1rem; font-family: var(--sans); letter-spacing: 0.025em; }
  .toc ol { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem 1.8rem; margin: 0; font-family: var(--sans); font-size: 0.86rem; }
  .toc li::marker { color: var(--accent); font-variant-numeric: tabular-nums; }
  .toc a { text-decoration-color: transparent; }
  .toc a:hover { text-decoration-color: currentColor; }

  .section { padding-block: clamp(3.25rem, 7vw, 4.5rem); border-bottom: 1px solid var(--rule); }
  .argument, .critical-item, .concept, .tip-item, .action-item, .meta-item, .further-item { padding-block: 1.55rem; border-top: 1px solid var(--rule); }
  .argument:first-of-type, .critical-item:first-of-type, .concept:first-of-type, .tip-item:first-of-type,
  .action-item:first-of-type, .meta-item:first-of-type, .further-item:first-of-type { border-top: 0; padding-top: 0; }
  .prose { max-width: 70ch; line-height: 1.9; }
  .prose p, .prose ul, .prose ol, .prose .table-scroll { margin-bottom: 1rem; }
  .source-ref { margin-top: 0.95rem; color: var(--muted); font-family: var(--sans); font-size: 0.78rem; letter-spacing: 0.012em; }
  .concept-boundary, .meta-delta { margin-top: 0.65rem; color: var(--muted); font-size: 0.9rem; }
  .relations { margin: 0 0 2rem; padding: 1.15rem 1.25rem; border-block: 1px solid var(--rule); background: var(--surface-alt); }
  .relations ul { margin-bottom: 0; }

  .tips-list { border-bottom: 1px solid var(--rule); }
  .tip-item__heading { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
  .tip-item__heading p { flex: 0 0 auto; color: var(--accent-strong); font-family: var(--sans); font-size: 1rem; font-weight: 750; font-variant-numeric: tabular-nums; }

  .quote { margin: 0 0 2.25rem; padding: 0.65rem 0 0.65rem 1.5rem; border-left: 1px solid var(--accent); }
  .quote-kind { color: var(--accent); font-family: var(--sans); font-size: 0.76rem; font-weight: 700; }
  .quote-original { color: var(--ink); font-size: 1.15rem; line-height: 1.82; }
  .quote-translation { color: var(--body); }
  .quote-translation span { margin-right: 0.55rem; color: var(--muted); font-family: var(--sans); font-size: 0.78rem; }
  .quote footer { color: var(--muted); font-family: var(--sans); font-size: 0.8rem; }
  .paraphrase { margin-bottom: 2rem; padding-block: 1rem; border-block: 1px solid var(--rule); }

  .action-item ul { margin-bottom: 0; color: var(--muted); }
  .knowledge-list { list-style: none; padding: 0; }
  .knowledge-list li { padding-block: 0.7rem; border-top: 1px solid var(--rule); }
  .knowledge-type, .source-id { color: var(--accent); font-family: var(--sans); font-size: 0.78rem; font-weight: 700; }
  .knowledge-link { color: var(--muted); }
  .source-list { padding-left: 1.4rem; }
  .source-list li { padding: 0.8rem 0 0.9rem 0.2rem; border-top: 1px solid var(--rule); }
  .source-list p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.88rem; }

  .table-scroll { max-width: 100%; overflow-x: auto; margin-block: 1.25rem; border: 1px solid var(--rule); scrollbar-color: var(--accent) var(--surface-alt); }
  .table-scroll:focus-visible { outline-offset: 2px; }
  table { width: 100%; min-width: 34rem; border-collapse: collapse; font-family: var(--sans); font-size: 0.86rem; }
  th, td { min-width: 7rem; padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
  th { color: var(--ink); background: var(--surface-alt); }

  .back-link { margin-top: 2rem; font-family: var(--sans); font-size: 0.8rem; }
  .footer { display: flex; justify-content: space-between; gap: 1rem; padding: 2rem max(1.5rem, calc((100% - var(--measure) + 3rem) / 2)); color: var(--muted); font-family: var(--sans); font-size: 0.75rem; letter-spacing: 0.03em; }
  .footer p { margin: 0.2rem 0; }

  [hidden] { display: none !important; }

  @keyframes opening-page {
    from { opacity: 0.68; filter: blur(3px); clip-path: inset(0 0 7% 0); }
    to { opacity: 1; filter: blur(0); clip-path: inset(0); }
  }

  @media (max-width: 640px) {
    html { font-size: 16px; }
    .report-shell { width: 100%; margin: 0; border: 0; }
    .page { padding-inline: 1.15rem; }
    h1 { font-size: clamp(2.25rem, 12vw, 3.2rem); }
    h2 { gap: 0.75rem; }
    .header { padding-block: 3.25rem 2.75rem; }
    .header::before { top: 1.2rem; width: 2.75rem; }
    .header__review { margin-top: 1.65rem; padding-top: 1.25rem; font-size: 1.06rem; }
    .header__meta { flex-direction: column; align-items: center; gap: 0.2rem; }
    .header__meta span + span::before { content: none; }
    .scope-row { grid-template-columns: 1fr; gap: 0.25rem; padding-inline: 0.85rem; }
    .toolbar button { flex: 1 1 auto; justify-content: center; }
    .status { flex-basis: 100%; }
    .toc ol { grid-template-columns: 1fr; }
    .section { padding-block: 3rem; }
    .footer { flex-direction: column; align-items: center; text-align: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
  }

  @media print {
    @page { margin: 1.8cm; }
    :root, [data-theme] {
      color-scheme: light;
      --bg: #fff;
      --surface: #fff;
      --surface-alt: #f5f1ea;
      --ink: #181411;
      --body: #312b26;
      --muted: #5f574f;
      --rule: #bbb3a8;
      --accent: #684b2d;
      --accent-strong: #51361f;
      --accent-soft: #f1ece4;
    }
    html { font-size: 11pt; }
    body { background: #fff; }
    .report-shell { width: 100%; margin: 0; border: 0; }
    .skip-link, .toolbar-wrap, .back-link { display: none !important; }
    .header { padding-block: 0.5cm 0.8cm; }
    .header .page { animation: none; }
    .toc { padding-block: 0.6cm; }
    .section { padding-block: 0.9cm; break-before: auto; }
    h2, h3 { break-after: avoid; }
    .argument, .critical-item, .concept, .tip-item, .quote, .paraphrase, .action-item,
    .meta-item, .source-list li, table { break-inside: avoid; }
    .table-scroll { overflow: visible; border: 0; }
    table { min-width: 0; font-size: 8.5pt; }
    th, td { min-width: 0; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳至主要內容</a>

  <div class="report-shell">
  <header class="header">
    <div class="page">
      <h1>{{BOOK_TITLE}}</h1>
      <p class="header__author">{{BOOK_AUTHOR}}</p>
      <p class="header__meta"><span>{{REPORT_MODE}}</span><span>{{BOOK_TYPE_TAG}}</span></p>
      <p class="header__review">{{ONE_LINE_REVIEW}}</p>
    </div>
  </header>

  {{COVERAGE_HTML}}

  <div class="toolbar-wrap">
    <div class="toolbar page" role="toolbar" aria-label="報告工具">
      <button type="button" id="copy-md">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
        <span>複製 Markdown</span>
      </button>
      <button type="button" id="download-md" data-filename="{{DOWNLOAD_FILENAME}}">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 19h16"/></svg>
        <span>下載 Markdown</span>
      </button>
      <button type="button" id="theme-toggle" aria-label="切換深色模式">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 15.5A8 8 0 0 1 8.5 4 8 8 0 1 0 20 15.5Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="theme-text">深色模式</span>
      </button>
      <p class="status" id="export-status" role="status" aria-live="polite"></p>
      <div class="copy-recovery" id="copy-recovery" hidden>
        <p>複製失敗。可下載 Markdown，或手動選取下方文字。</p>
        <textarea id="report-markdown" readonly spellcheck="false">{{REPORT_MARKDOWN}}</textarea>
      </div>
      <noscript><p class="noscript-note">JavaScript 不可用：正文仍可選取，也可使用瀏覽器列印或另存。</p></noscript>
    </div>
  </div>

  {{TOC_HTML}}

  <main class="page" id="main-content" tabindex="-1">
    {{REPORT_SECTIONS_HTML}}
  </main>

  <footer class="footer">
    <p>CRISP Reading</p>
    <p>{{GENERATION_DATE}}</p>
  </footer>
  </div>

<script>
(function () {
  "use strict";

  var root = document.documentElement;
  var themeButton = document.getElementById("theme-toggle");
  var themeText = document.getElementById("theme-text");
  var copyButton = document.getElementById("copy-md");
  var downloadButton = document.getElementById("download-md");
  var status = document.getElementById("export-status");
  var recovery = document.getElementById("copy-recovery");
  var markdownSource = document.getElementById("report-markdown");

  function setStatus(message, state) {
    status.textContent = message;
    status.dataset.state = state || "";
  }

  function setTheme(theme) {
    root.setAttribute("data-theme", theme);
    themeText.textContent = theme === "dark" ? "淺色模式" : "深色模式";
    themeButton.setAttribute("aria-label", theme === "dark" ? "切換淺色模式" : "切換深色模式");
    try { localStorage.setItem("crisp-theme", theme); } catch (error) {}
  }

  var savedTheme;
  try { savedTheme = localStorage.getItem("crisp-theme"); } catch (error) {}
  if (savedTheme === "dark" || savedTheme === "light") {
    setTheme(savedTheme);
  } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
    setTheme("dark");
  }

  themeButton.addEventListener("click", function () {
    setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  function revealRecovery() {
    recovery.hidden = false;
    markdownSource.focus();
    markdownSource.select();
  }

  function fallbackCopy(text) {
    recovery.hidden = false;
    markdownSource.value = text;
    markdownSource.focus();
    markdownSource.select();
    var copyResult = false;
    try { copyResult = document.execCommand("copy"); } catch (error) { copyResult = false; }
    return copyResult === true;
  }

  copyButton.addEventListener("click", async function () {
    var text = markdownSource.value;
    var copied = false;
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
      try {
        await navigator.clipboard.writeText(text);
        copied = true;
      } catch (error) {
        copied = false;
      }
    }
    if (!copied) copied = fallbackCopy(text);
    if (copied) {
      recovery.hidden = true;
      setStatus("已複製 Markdown。", "success");
    } else {
      setStatus("複製失敗：可下載 Markdown 或手動選取下方文字。", "error");
      revealRecovery();
    }
  });

  downloadButton.addEventListener("click", function () {
    try {
      var blob = new Blob([markdownSource.value], { type: "text/markdown;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = downloadButton.dataset.filename || "reading-report.md";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      setStatus("Markdown 已下載。", "success");
    } catch (error) {
      setStatus("下載失敗：可手動選取下方 Markdown。", "error");
      revealRecovery();
    }
  });
})();
</script>
</body>
</html>
